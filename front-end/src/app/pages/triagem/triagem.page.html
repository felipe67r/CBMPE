<app-main-header pageTitle="Triagem (Nova Ocorrência)" [showBackButton]="true">
</app-main-header>

<ion-content [fullscreen]="true" class="triagem-content">
  <div class="page-container">
    <div class="page-header">
      <h2 class="page-title">Triagem de Ocorrência</h2>
      <p class="page-description">Preencha os dados da triagem</p>
    </div>

    <form class="triagem-form">
      <div class="form-section">
        <h3 class="section-title">Informações Básicas</h3>

        <ion-item class="form-item">
          <ion-label position="stacked">Tipo de Ocorrência</ion-label>
          <ion-select interface="popover" placeholder="Selecione o tipo">
            <ion-select-option value="tipo-1">Tipo 1</ion-select-option>
            <ion-select-option value="tipo-2">Tipo 2</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Descrição</ion-label>
          <ion-textarea rows="3" placeholder="Descreva a ocorrência"></ion-textarea>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Local</ion-label>
          <ion-input placeholder="Local da ocorrência"></ion-input>
        </ion-item>
      </div>
    </form>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <app-nav-button
      label="Próximo"
      link="/evidencias"
      buttonColor="primary">
    </app-nav-button>
  </ion-toolbar>
</ion-footer>
