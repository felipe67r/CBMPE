<app-main-header pageTitle="Triagem de Ocorrência" [showBackButton]="true">
</app-main-header>

<ion-content [fullscreen]="true" class="evidencias-content">
  <div class="page-container">
    <div class="page-header">
      <h2 class="page-title">Evidências</h2>
      <p class="page-description">Adicione as evidências da ocorrência</p>
    </div>

    <form class="evidencias-form">
      <div class="form-section">
        <h3 class="section-title">Tipo de Ocorrência</h3>

        <ion-item class="form-item">
          <ion-label position="stacked">Tipo de Ocorrência</ion-label>
          <ion-select interface="popover" placeholder="Selecione o tipo">
            <ion-select-option value="tipo-1">Tipo 1</ion-select-option>
            <ion-select-option value="tipo-2">Tipo 2</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Geral da Ocorrência</ion-label>
          <ion-textarea rows="2" placeholder="Descrição geral"></ion-textarea>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Presença de Vítimas</ion-label>
          <ion-select interface="popover" placeholder="Selecione">
            <ion-select-option value="sim">Sim</ion-select-option>
            <ion-select-option value="nao">Não</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Locais de Risco</ion-label>
          <ion-select interface="popover" placeholder="Selecione">
            <ion-select-option value="sim">Sim</ion-select-option>
            <ion-select-option value="nao">Não</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item class="form-item">
          <ion-label position="stacked">Localização GPS</ion-label>
          <ion-input placeholder="Inserir GPS"></ion-input>
        </ion-item>
      </div>
    </form>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <app-nav-button
      label="Próximo"
      link="/conclusao"
      buttonColor="primary">
    </app-nav-button>
  </ion-toolbar>
</ion-footer>
