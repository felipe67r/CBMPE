<ion-item [class.has-error]="error">
  <ion-label *ngIf="label" position="floating" [class.required]="required">
    {{ label }}
  </ion-label>
  <ion-input
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (ionChange)="handleChange($event)"
    (ionBlur)="handleBlur()">
  </ion-input>
</ion-item>

<div class="error-message" *ngIf="error">
  {{ error }}
</div>
