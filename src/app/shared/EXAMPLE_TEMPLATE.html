<!-- Exemplo de template usando os componentes compartilhados -->

<ion-header>
  <ion-toolbar>
    <ion-title>Exemplo de Formulário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Card para agrupar o formulário -->
  <app-card title="Cadastro de Usuário">
    <form (submit)="handleFormSubmit()">
      <!-- Campo de Nome -->
      <app-form-field
        label="Nome Completo"
        type="text"
        placeholder="Digite seu nome completo"
        [(ngModel)]="name"
        name="name"
        [required]="true">
      </app-form-field>

      <!-- Campo de Email -->
      <app-form-field
        label="Email"
        type="email"
        placeholder="seu@email.com"
        [(ngModel)]="email"
        name="email"
        [required]="true"
        (blur)="validateEmail()"
        [error]="emailError">
      </app-form-field>

      <!-- Campo de Senha -->
      <app-form-field
        label="Senha"
        type="password"
        placeholder="Digite uma senha segura"
        [(ngModel)]="password"
        name="password"
        [required]="true">
      </app-form-field>

      <!-- Botões de ação -->
      <div class="button-group">
        <app-button
          label="Enviar"
          type="submit"
          color="azul-logo"
          [disabled]="!name || !email || !password || emailError">
        </app-button>

        <app-button
          label="Limpar"
          color="cinza-cbmpe"
          (onClick)="handleReset()">
        </app-button>

        <app-button
          label="Voltar"
          type="link"
          link="/home"
          color="vermelho-logo">
        </app-button>
      </div>
    </form>
  </app-card>

  <!-- Card adicional com mais exemplos -->
  <app-card title="Exemplos de Cores">
    <div class="color-examples">
      <app-button label="Amarelo" color="amarelo-logo"></app-button>
      <app-button label="Azul" color="azul-logo"></app-button>
      <app-button label="Vermelho" color="vermelho-logo"></app-button>
      <app-button label="Cinza" color="cinza-cbmpe"></app-button>
    </div>
  </app-card>
</ion-content>
